<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
<rect width="960" height="520" fill="white"/>
<text x="48" y="64" font-family="Georgia, serif" font-size="30" fill="#0B1F4A" font-weight="bold">Five ways to arrange agents</text>
<text x="48" y="94" font-family="Georgia, serif" font-size="16" fill="#475569">Successes on the 12-order Fernhill set, from Lessons 06 to 13.</text>
<rect x="48" y="150" width="160" height="110" rx="10" fill="#0B1F4A"/>
<text x="128.0" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="white" font-weight="bold">Sequential</text>
<text x="128.0" y="204" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="white">pipeline</text>
<text x="128.0" y="224" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="white">10 of 12 with review</text><rect x="232" y="150" width="160" height="110" rx="10" fill="#0891B2"/>
<text x="312.0" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="white" font-weight="bold">Parallel</text>
<text x="312.0" y="204" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="white">fan-out batch</text>
<text x="312.0" y="224" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="white">makespan priced</text><rect x="416" y="150" width="160" height="110" rx="10" fill="#0891B2"/>
<text x="496.0" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="white" font-weight="bold">Hierarchical</text>
<text x="496.0" y="204" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="white">delegation tax</text>
<text x="496.0" y="224" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="white">7 of 12</text><rect x="600" y="150" width="160" height="110" rx="10" fill="#0891B2"/>
<text x="680.0" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="white" font-weight="bold">Debate</text>
<text x="680.0" y="204" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="white">two scorers + judge</text>
<text x="680.0" y="224" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="white">12 of 12</text><rect x="784" y="150" width="128" height="110" rx="10" fill="#0891B2"/>
<text x="848.0" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="white" font-weight="bold">Blackboard</text>
<text x="848.0" y="204" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="white">shared board</text>
<text x="848.0" y="224" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="white">10 of 12</text><rect x="48" y="310" width="864" height="90" rx="10" fill="#E0F2FE"/>
<text x="480.0" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#0B1F4A" font-weight="bold">And the baseline they must beat</text>
<text x="480.0" y="364" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#0B1F4A">single agent: 7 of 12, 4 policy escapes, cheapest per success at 169.7 tokens</text><text x="48" y="496" font-family="Georgia, serif" font-size="13" fill="#475569">No topology wins everywhere: on chained orders the pipeline ties the single agent at 2.24x the tokens (Lesson 05).</text>
</svg>