<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
<rect width="960" height="520" fill="white"/>
<text x="48" y="64" font-family="Georgia, serif" font-size="30" fill="#0B1F4A" font-weight="bold">Cost per success, all six systems</text>
<text x="48" y="94" font-family="Georgia, serif" font-size="16" fill="#475569">Tokens per successful order, Lesson 24. Cost per success refuses to let a system look cheap by failing cheaply.</text>
<text x="48" y="172" font-family="Georgia, serif" font-size="15" fill="#0B1F4A">blackboard (pointer priced)</text><rect x="300" y="150" width="112" height="26" rx="5" fill="#F59E0B"/><text x="424" y="170" font-family="Georgia, serif" font-size="15" fill="#0B1F4A" font-weight="bold">86.7</text><text x="48" y="224" font-family="Georgia, serif" font-size="15" fill="#0B1F4A">single agent</text><rect x="300" y="202" width="219" height="26" rx="5" fill="#0B1F4A"/><text x="531" y="222" font-family="Georgia, serif" font-size="15" fill="#0B1F4A" font-weight="bold">169.7</text><text x="48" y="276" font-family="Georgia, serif" font-size="15" fill="#0B1F4A">pipeline (plain)</text><rect x="300" y="254" width="433" height="26" rx="5" fill="#DC2626"/><text x="745" y="274" font-family="Georgia, serif" font-size="15" fill="#0B1F4A" font-weight="bold">334.3</text><text x="48" y="328" font-family="Georgia, serif" font-size="15" fill="#0B1F4A">orchestrated</text><rect x="300" y="306" width="470" height="26" rx="5" fill="#0891B2"/><text x="782" y="326" font-family="Georgia, serif" font-size="15" fill="#0B1F4A" font-weight="bold">362.9</text><text x="48" y="380" font-family="Georgia, serif" font-size="15" fill="#0B1F4A">debate</text><rect x="300" y="358" width="504" height="26" rx="5" fill="#0891B2"/><text x="816" y="378" font-family="Georgia, serif" font-size="15" fill="#0B1F4A" font-weight="bold">389.2</text><text x="48" y="432" font-family="Georgia, serif" font-size="15" fill="#0B1F4A">pipeline + reviewer</text><rect x="300" y="410" width="560" height="26" rx="5" fill="#0891B2"/><text x="872" y="430" font-family="Georgia, serif" font-size="15" fill="#0B1F4A" font-weight="bold">432.3</text><text x="48" y="496" font-family="Georgia, serif" font-size="13" fill="#475569">The plain pipeline is the worst row: coordination prices for the baseline's exact results. Blackboard messages price pointers, not board content.</text>
</svg>