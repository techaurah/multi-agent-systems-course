name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Validate course structure (lessons, fixtures, gates)
        run: python tools/validate_course.py
      - name: Check relative links
        run: python tools/check_links.py
      - name: Run every lesson smoke test
        run: |
          for d in [0-9][0-9]-*/; do
            (cd "$d" && python smoke_test.py)
          done
